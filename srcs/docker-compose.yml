services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

volumes:
   mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGNAME}/data/mariadb

networks:
  inception:
    driver: bridge
